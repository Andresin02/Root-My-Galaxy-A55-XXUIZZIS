name: Parse BTF directly

on:
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify BTF file exists
        run: |
          ls -lh analysis/vmlinux.btf
          file analysis/vmlinux.btf
          xxd analysis/vmlinux.btf | head -2

      - name: Parse BTF with pure Python
        run: |
          cat > /tmp/parse_btf.py << 'PYEOF'
          import struct, sys

          path = 'analysis/vmlinux.btf'
          data = open(path, 'rb').read()

          magic, version, flags, hdr_len, type_off, type_len, str_off, str_len = \
              struct.unpack_from('<HBBIIIII', data, 0)
          print(f"magic=0x{magic:04x} version={version} hdr_len={hdr_len}")
          print(f"type_off={type_off} type_len={type_len} str_off={str_off} str_len={str_len}")

          if magic != 0xeb9f:
              print("ERROR: not a BTF file")
              sys.exit(1)

          types_start = hdr_len + type_off
          types_end = types_start + type_len
          strings_start = hdr_len + str_off

          def get_string(off):
              if off == 0: return ''
              end = data.index(b'\x00', strings_start + off)
              return data[strings_start + off:end].decode('utf-8', errors='replace')

          types = []
          pos = types_start
          while pos < types_end:
              name_off, info, size_type = struct.unpack_from('<III', data, pos)
              pos += 12
              kind = (info >> 24) & 0x1f
              vlen = info & 0xffff
              name = get_string(name_off)

              if kind in (4, 5):
                  members = []
                  for _ in range(vlen):
                      mn, mt, mo = struct.unpack_from('<III', data, pos)
                      pos += 12
                      members.append((get_string(mn), mt, mo))
                  types.append(('STRUCT' if kind == 4 else 'UNION', name, size_type, members))
              elif kind == 1:
                  pos += 4
                  types.append(('INT', name, size_type, []))
              elif kind == 3:
                  pos += 12
                  types.append(('ARRAY', name, size_type, []))
              elif kind == 6:
                  pos += vlen * 8
                  types.append(('ENUM', name, size_type, []))
              elif kind == 13:
                  pos += vlen * 8
                  types.append(('FUNC_PROTO', name, size_type, []))
              elif kind == 14:
                  pos += 4
                  types.append(('VAR', name, size_type, []))
              elif kind == 15:
                  pos += vlen * 12
                  types.append(('DATASEC', name, size_type, []))
              elif kind == 17:
                  pos += 4
                  types.append(('DECL_TAG', name, size_type, []))
              elif kind == 19:
                  pos += vlen * 12
                  types.append(('ENUM64', name, size_type, []))
              else:
                  types.append((f'KIND_{kind}', name, size_type, []))

          print(f"Parsed {len(types)} types")

          def dump(name):
              for t in types:
                  if t[0] in ('STRUCT', 'UNION') and t[1] == name:
                      print(f"\n{t[0]} {name} (size=0x{t[2]:x} = {t[2]} bytes):")
                      for mn, mt, mo in t[3]:
                          byte_off = mo // 8
                          bit_off = mo % 8
                          print(f"  +0x{byte_off:04x} ({byte_off:4d}) bit={bit_off}: {mn}")
                      return
              print(f"\n{name}: NOT FOUND")

          for s in ['pipe_buffer', 'pipe_inode_info', 'cred', 'task_struct',
                    'mm_struct', 'file_operations', 'selinux_state', 'rt_mutex_waiter']:
              dump(s)
          PYEOF
          python3 /tmp/parse_btf.py | tee structs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: btf-analysis
          path: structs.txt
