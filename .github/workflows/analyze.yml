name: Analyze kernel offsets from BTF

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves binutils bpftool

      - name: Verify BTF
        run: |
          ls -lh analysis/
          file analysis/vmlinux.btf
          bpftool btf dump file analysis/vmlinux.btf format raw 2>/dev/null | head -5 || true

      - name: Dump structs we need
        run: |
          for s in pipe_buffer pipe_inode_info cred task_struct mm_struct file_operations selinux_state rt_mutex_waiter; do
            echo "======================== $s ========================"
            pahole -C $s analysis/vmlinux.btf 2>&1 | head -80
            echo ""
          done > structs.txt
          cat structs.txt

      - name: Dump C definitions
        run: |
          bpftool btf dump file analysis/vmlinux.btf format c > vmlinux_types.c 2>/dev/null || true
          wc -l vmlinux_types.c
          grep -A 30 "struct pipe_buffer {" vmlinux_types.c | head -40
          echo "---"
          grep -A 40 "struct pipe_inode_info {" vmlinux_types.c | head -50
          echo "---"
          grep -A 50 "struct task_struct {" vmlinux_types.c | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: btf-analysis
          path: |
            structs.txt
            vmlinux_types.c
