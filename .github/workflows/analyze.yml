name: Analyze kernel offsets from BTF

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pahole
        run: |
          sudo apt-get update
          sudo apt-get install -y dwarves
          pahole --version

      - name: Verify BTF file
        run: |
          ls -lh analysis/
          file analysis/vmlinux.btf || true
          xxd analysis/vmlinux.btf | head -3

      - name: Dump structs with pahole
        id: pahole
        continue-on-error: true
        run: |
          for s in pipe_buffer pipe_inode_info cred task_struct mm_struct file_operations selinux_state rt_mutex_waiter; do
            echo "======================== $s ========================"
            pahole -C $s analysis/vmlinux.btf 2>&1 | head -80
            echo ""
          done > structs.txt
          cat structs.txt

      - name: Fallback - strings on BTF
        if: steps.pahole.outcome == 'failure'
        run: |
          echo "pahole failed, dumping strings" > structs.txt
          strings analysis/vmlinux.btf | grep -iE "pipe_buffer|pipe_inode|task_struct|cred|file_operations" | head -40 >> structs.txt
          cat structs.txt

      - uses: actions/upload-artifact@v4
        with:
          name: btf-analysis
          path: structs.txt
